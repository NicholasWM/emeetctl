[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NicholasWM/emeetctl"

[workspace.dependencies]
emeetctl-core = { path = "crates/emeetctl-core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.31"

[profile.release]
lto = "thin"
strip = true

# Dependências (decodificador JPEG, egui) otimizadas mesmo no build de dev:
# sem isso a prévia cai de ~60 para ~6 fps.
[profile.dev.package."*"]
opt-level = 3
