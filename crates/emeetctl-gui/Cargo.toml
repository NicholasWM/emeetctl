[package]
name = "emeetctl-gui"
description = "Interface gráfica do emeetctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "emeetctl-gui"
path = "src/main.rs"

[dependencies]
emeetctl-core.workspace = true
eframe.workspace = true
v4l.workspace = true
zune-jpeg.workspace = true

[package.metadata.deb]
name = "emeetctl"
maintainer = "Nicholas Mazzei <NicholasWM@users.noreply.github.com>"
copyright = "2026, Nicholas Mazzei"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
Linux control for the EMEET SmartCam S600L webcam: ring light (RGB and fill light), \
image controls (focus, zoom, exposure, white balance) and live preview. \
Ships the GUI (emeetctl-gui), the CLI (emeetctl) and an MCP server (emeetctl-mcp). \
Not affiliated with EMEET."""
section = "video"
priority = "optional"
depends = "$auto"
maintainer-scripts = "../../packaging/debian/"
assets = [
    ["target/release/emeetctl-gui", "usr/bin/", "755"],
    ["target/release/emeetctl", "usr/bin/", "755"],
    ["target/release/emeetctl-mcp", "usr/bin/", "755"],
    ["../../udev/70-emeetctl.rules", "usr/lib/udev/rules.d/", "644"],
    ["../../emeetctl.desktop", "usr/share/applications/", "644"],
    ["../../README.md", "usr/share/doc/emeetctl/", "644"],
    ["../../assets/icons/hicolor/16x16/apps/emeetctl.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../assets/icons/hicolor/24x24/apps/emeetctl.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../assets/icons/hicolor/32x32/apps/emeetctl.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../assets/icons/hicolor/48x48/apps/emeetctl.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../assets/icons/hicolor/64x64/apps/emeetctl.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../assets/icons/hicolor/128x128/apps/emeetctl.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../assets/icons/hicolor/256x256/apps/emeetctl.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../assets/icons/hicolor/512x512/apps/emeetctl.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
